<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in &middot; eNotifier Webmaster Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}</style>
</head>
<body class="h-full bg-slate-950">
  <div class="relative flex min-h-full items-center justify-center overflow-hidden p-4">
    <!-- ambient gradient blobs -->
    <div class="pointer-events-none absolute -top-24 -left-24 h-96 w-96 rounded-full bg-indigo-600/30 blur-3xl"></div>
    <div class="pointer-events-none absolute -bottom-24 -right-24 h-96 w-96 rounded-full bg-violet-600/20 blur-3xl"></div>

    <div class="relative w-full max-w-sm">
      <div class="rounded-2xl border border-white/10 bg-white p-8 shadow-2xl">
        <div class="mb-6 text-center">
          <span class="mx-auto mb-4 inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-500 to-indigo-700 text-xl font-bold text-white shadow-lg shadow-indigo-600/30">eN</span>
          <h1 class="text-xl font-semibold tracking-tight text-slate-900">Welcome back</h1>
          <p class="text-sm text-slate-500">Sign in to the Webmaster Console</p>
        </div>
        {% if error %}
        <div class="mb-4 flex items-start gap-2 rounded-lg bg-rose-50 px-3 py-2 text-sm text-rose-700 ring-1 ring-inset ring-rose-600/10">
          <svg class="mt-0.5 h-4 w-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path stroke-linecap="round" d="M12 8v4M12 16h.01"/></svg>
          <span>{{ error }}</span>
        </div>
        {% endif %}
        <form method="post" class="space-y-4">
          {% csrf_token %}
          <div>
            <label class="mb-1.5 block text-sm font-medium text-slate-700">Username / Email</label>
            <input name="username" autofocus required class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm shadow-sm transition focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30">
          </div>
          <div>
            <label class="mb-1.5 block text-sm font-medium text-slate-700">Password</label>
            <input name="password" type="password" required class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm shadow-sm transition focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30">
          </div>
          <button type="submit" class="w-full rounded-lg bg-indigo-600 py-2.5 font-semibold text-white shadow-sm shadow-indigo-600/30 transition hover:bg-indigo-700">Sign in</button>
        </form>
      </div>
      <p class="mt-6 text-center text-xs text-slate-500">eNotifier &middot; Webmaster Console</p>
    </div>
  </div>
</body>
</html>
